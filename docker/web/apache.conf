<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hc-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/hc-dev-access.log combined
</VirtualHost>
