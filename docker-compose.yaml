services:
  reverse:
    image: nginx:1.27-alpine
    container_name: hc-dev-reverse
    ports:
      - "8080:80"
    volumes:
      - ./docker/reverse/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - hc-dev-net

  web:
    build: ./docker/web
    container_name: hc-dev-web
    volumes:
      - ./:/var/www/html
      - ./.env.dev:/var/www/.env:ro
    depends_on:
      - db
    networks:
      - hc-dev-net

  db:
    image: postgres:17
    container_name: hc-dev-db
    environment:
      POSTGRES_DB: hc_account
      POSTGRES_USER: hc_user
      POSTGRES_PASSWORD: hc_password_dev
      TZ: Asia/Tokyo
    ports:
      - "5433:5432"
    volumes:
      - hc_dev_db:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - hc-dev-net

  adminer:
    image: adminer
    container_name: hc-dev-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - hc-dev-net

volumes:
  hc_dev_db:

networks:
  hc-dev-net:
    driver: bridge
